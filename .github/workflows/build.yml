name: Build Executable

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install FFmpeg
      run: choco install ffmpeg -y

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter moviepy imageio imageio-ffmpeg openai-whisper google-generativeai requests numpy pyinstaller

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --copy-metadata imageio --copy-metadata imageio_ffmpeg --name "AutoCut_AI_Suite" app.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoCut_AI_Suite_Windows
        path: dist/AutoCut_AI_Suite/
